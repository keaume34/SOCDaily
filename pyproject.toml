[project]
name = "socdaily"
version = "0.1.0"
description = "SOC Analyst learning database builder: ingest PDFs, generate flashcards + MCQs via LLM, import to SQLite."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "keaume34" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "httpx>=0.27.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
socdaily = "socdaily.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socdaily"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# B008: typer requires call-in-default for Argument/Option.
ignore = ["E501", "B008"]
