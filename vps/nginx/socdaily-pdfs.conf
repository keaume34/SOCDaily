# SOCDaily — serves /var/www/socdaily-pdfs over the Tailscale interface.
# Only the tailnet can reach this. App fetches:
#   http://100.110.125.8:8080/<subject>/<file>.pdf#page=N

server {
    listen 100.110.125.8:8080 default_server;
    server_name _;

    root /var/www/socdaily-pdfs;
    autoindex on;
    autoindex_format json;

    # PDFs benefit from byte-range requests so the viewer can stream.
    location ~ \.pdf$ {
        types        { }
        default_type application/pdf;
        add_header   Accept-Ranges bytes;
        add_header   Cache-Control "public, max-age=2592000, immutable";
        add_header   Access-Control-Allow-Origin "*";
        add_header   X-Content-Type-Options nosniff;
        try_files    $uri =404;
    }

    # Healthcheck endpoint for the app to verify reachability.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Block dot-files.
    location ~ /\. { deny all; }
}
