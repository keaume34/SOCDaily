# SOCDaily content generator API — public reverse proxy.
#
# Replace `socdaily.example.com` with your real hostname. Run certbot
# (e.g. `certbot --nginx -d socdaily.example.com`) once before enabling
# the 443 server. The 80 server only redirects to HTTPS so we don't
# accept any auth-bearing request over plaintext.
#
# Upstream: the FastAPI service runs on 127.0.0.1:8000 via the systemd
# unit at vps/socdaily-api.service. Bearer-token auth is enforced inside
# the FastAPI app — nginx itself only does TLS + rate limiting.

# Per-IP rate limit: 30 req / 10 s. /generate is the expensive one;
# stricter cap below.
limit_req_zone $binary_remote_addr zone=socdaily_api:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=socdaily_generate:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name socdaily.example.com;

    # ACME challenges go to the webroot; everything else gets a permanent
    # redirect to HTTPS so credentials never touch plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name socdaily.example.com;

    # certbot manages these. Replace if you provision certs another way.
    ssl_certificate     /etc/letsencrypt/live/socdaily.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socdaily.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cap large uploads. PDFs over ~50 MB are unusual for study material.
    client_max_body_size 50m;

    # Strip Server header noise.
    server_tokens off;

    # Healthcheck stays open so monitors don't burn rate-limit quota.
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_set_header Host $host;
    }

    # Generate is the LLM-cost endpoint — tighter limit + burst.
    location = /generate {
        limit_req zone=socdaily_generate burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000/generate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # LLM calls can take a while — allow up to 5 minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Everything else (currently /pdfs GET + POST) shares the standard
    # rate limit.
    location / {
        limit_req zone=socdaily_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
