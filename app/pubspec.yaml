name: socdaily_app
description: "SOCDaily — SOC Analyst learning app (flashcards + MCQs + AI tutor)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.6.2

  # Persistence
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # i18n
  intl: ^0.19.0

  # HTTP / AI
  dio: ^5.7.0

  # Utilities
  collection: ^1.18.0
  uuid: ^4.5.1

  # UI / charts
  fl_chart: ^0.69.0
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/seed/
    - assets/i18n/
