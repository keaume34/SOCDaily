<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Happy Otto — sparkly eyes, big smile -->
  <!-- Body -->
  <ellipse cx="128" cy="186" rx="64" ry="52" fill="#3B3B3A"/>
  <!-- Badge -->
  <rect x="104" y="172" width="48" height="20" rx="10" fill="#CF4500"/>
  <text x="128" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF">SOC</text>
  <!-- Head -->
  <circle cx="128" cy="108" r="52" fill="#E8C9A0"/>
  <!-- Ear tufts (perked up) -->
  <path d="M82 68 L70 32 L102 62 Z" fill="#D4A574"/>
  <path d="M174 68 L186 32 L154 62 Z" fill="#D4A574"/>
  <!-- Face disc -->
  <ellipse cx="128" cy="108" rx="40" ry="34" fill="#F5E6D0"/>
  <!-- Eyes (sparkly) -->
  <circle cx="108" cy="104" r="14" fill="#FFF"/>
  <circle cx="148" cy="104" r="14" fill="#FFF"/>
  <circle cx="110" cy="103" r="6" fill="#141413"/>
  <circle cx="150" cy="103" r="6" fill="#141413"/>
  <circle cx="112" cy="100" r="3" fill="#FFF"/>
  <circle cx="152" cy="100" r="3" fill="#FFF"/>
  <circle cx="108" cy="106" r="1.5" fill="#FFF"/>
  <circle cx="148" cy="106" r="1.5" fill="#FFF"/>
  <!-- Beak -->
  <path d="M122 116 L128 124 L134 116 Z" fill="#F59E0B"/>
  <!-- Big smile -->
  <path d="M116 125 Q128 135 140 125" stroke="#D4A574" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="96" cy="114" rx="7" ry="4" fill="#F5A0A0" opacity="0.4"/>
  <ellipse cx="160" cy="114" rx="7" ry="4" fill="#F5A0A0" opacity="0.4"/>
  <!-- Sparkles -->
  <circle cx="68" cy="60" r="3" fill="#F59E0B"/>
  <circle cx="190" cy="56" r="2.5" fill="#F59E0B"/>
  <circle cx="178" cy="42" r="2" fill="#FBBF24"/>
  <!-- Feet -->
  <ellipse cx="108" cy="236" rx="14" ry="5" fill="#F59E0B"/>
  <ellipse cx="148" cy="236" rx="14" ry="5" fill="#F59E0B"/>
</svg>
