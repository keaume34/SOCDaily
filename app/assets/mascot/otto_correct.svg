<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Body / hoodie -->
  <ellipse cx="128" cy="170" rx="72" ry="60" fill="#4B5563"/>
  <!-- Hoodie front zip line -->
  <line x1="128" y1="130" x2="128" y2="230" stroke="#374151" stroke-width="2"/>
  <!-- SOC badge -->
  <rect x="100" y="155" width="56" height="24" rx="6" fill="#1D4ED8"/>
  <text x="128" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SOC</text>
  <!-- Head (round owl) -->
  <circle cx="128" cy="100" r="56" fill="#D4A574"/>
  <!-- Ear tufts (perked up — happy!) -->
  <path d="M80 58 L68 22 L98 52 Z" fill="#C4956A"/>
  <path d="M176 58 L188 22 L158 52 Z" fill="#C4956A"/>
  <path d="M82 56 L73 30 L96 52 Z" fill="#E8C9A0"/>
  <path d="M174 56 L183 30 L160 52 Z" fill="#E8C9A0"/>
  <!-- Face disc -->
  <ellipse cx="128" cy="98" rx="44" ry="38" fill="#E8D5B8"/>
  <!-- Left eye white (bigger — excited) -->
  <circle cx="106" cy="94" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/>
  <!-- Right eye white -->
  <circle cx="150" cy="94" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/>
  <!-- Left pupil (sparkly) -->
  <circle cx="108" cy="93" r="8" fill="#1F2937"/>
  <circle cx="111" cy="89" r="3.5" fill="#FFFFFF"/>
  <circle cx="105" cy="96" r="2" fill="#FFFFFF"/>
  <!-- Right pupil (sparkly) -->
  <circle cx="152" cy="93" r="8" fill="#1F2937"/>
  <circle cx="155" cy="89" r="3.5" fill="#FFFFFF"/>
  <circle cx="149" cy="96" r="2" fill="#FFFFFF"/>
  <!-- Glasses bridge -->
  <path d="M124 94 Q128 90 132 94" stroke="#1F2937" stroke-width="2.5" fill="none"/>
  <!-- Glasses arms -->
  <path d="M88 92 L72 86" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M168 92 L184 86" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Beak -->
  <path d="M122 108 L128 118 L134 108 Z" fill="#F59E0B"/>
  <!-- Big smile -->
  <path d="M114 118 Q128 130 142 118" stroke="#92400E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Sparkle stars around head -->
  <path d="M60 60 L63 52 L66 60 L74 57 L66 60 L63 68 L60 60 L56 57 Z" fill="#F59E0B"/>
  <path d="M190 55 L193 47 L196 55 L204 52 L196 55 L193 63 L190 55 L186 52 Z" fill="#F59E0B"/>
  <path d="M170 40 L172 35 L174 40 L179 38 L174 40 L172 45 L170 40 L165 38 Z" fill="#FBBF24"/>
  <!-- Hoodie hood outline -->
  <path d="M72 105 Q70 70 85 50" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M184 105 Q186 70 171 50" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Wing/arm thumbs-up (right side) -->
  <ellipse cx="200" cy="155" rx="12" ry="18" fill="#C4956A" transform="rotate(-15 200 155)"/>
  <circle cx="198" cy="138" r="7" fill="#C4956A"/>
  <!-- Feet -->
  <ellipse cx="105" cy="228" rx="16" ry="6" fill="#F59E0B"/>
  <ellipse cx="151" cy="228" rx="16" ry="6" fill="#F59E0B"/>
</svg>
