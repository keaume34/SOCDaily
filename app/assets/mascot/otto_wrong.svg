<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Body / hoodie -->
  <ellipse cx="128" cy="170" rx="72" ry="60" fill="#4B5563"/>
  <!-- Hoodie front zip line -->
  <line x1="128" y1="130" x2="128" y2="230" stroke="#374151" stroke-width="2"/>
  <!-- SOC badge -->
  <rect x="100" y="155" width="56" height="24" rx="6" fill="#1D4ED8"/>
  <text x="128" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SOC</text>
  <!-- Head (round owl) -->
  <circle cx="128" cy="100" r="56" fill="#D4A574"/>
  <!-- Ear tufts (slightly drooped) -->
  <path d="M82 62 L76 36 L97 58 Z" fill="#C4956A"/>
  <path d="M174 62 L180 36 L159 58 Z" fill="#C4956A"/>
  <path d="M84 60 L79 40 L95 57 Z" fill="#E8C9A0"/>
  <path d="M172 60 L177 40 L161 57 Z" fill="#E8C9A0"/>
  <!-- Face disc -->
  <ellipse cx="128" cy="98" rx="44" ry="38" fill="#E8D5B8"/>
  <!-- Left eye white (squinting — worried) -->
  <ellipse cx="106" cy="94" rx="18" ry="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/>
  <!-- Right eye white -->
  <ellipse cx="150" cy="94" rx="18" ry="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/>
  <!-- Left pupil (looking aside) -->
  <circle cx="103" cy="94" r="7" fill="#1F2937"/>
  <circle cx="105" cy="91" r="2.5" fill="#FFFFFF"/>
  <!-- Right pupil -->
  <circle cx="147" cy="94" r="7" fill="#1F2937"/>
  <circle cx="149" cy="91" r="2.5" fill="#FFFFFF"/>
  <!-- Furrowed brow lines -->
  <path d="M90 82 L102 86" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>
  <path d="M166 82 L154 86" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>
  <!-- Glasses bridge -->
  <path d="M124 94 Q128 90 132 94" stroke="#1F2937" stroke-width="2.5" fill="none"/>
  <!-- Glasses glare line (investigating) -->
  <path d="M96 84 L100 88" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M160 84 L156 88" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Glasses arms -->
  <path d="M88 92 L72 86" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M168 92 L184 86" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Beak -->
  <path d="M122 108 L128 118 L134 108 Z" fill="#F59E0B"/>
  <!-- Thinking/concerned mouth -->
  <path d="M120 122 Q128 118 136 122" stroke="#92400E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Question mark -->
  <text x="186" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#EF4444" opacity="0.8">?</text>
  <!-- Hoodie hood outline -->
  <path d="M72 105 Q70 70 85 50" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M184 105 Q186 70 171 50" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="105" cy="228" rx="16" ry="6" fill="#F59E0B"/>
  <ellipse cx="151" cy="228" rx="16" ry="6" fill="#F59E0B"/>
</svg>
