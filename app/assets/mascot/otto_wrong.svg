<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Worried Otto — squinted eyes, frown -->
  <!-- Body -->
  <ellipse cx="128" cy="186" rx="64" ry="52" fill="#3B3B3A"/>
  <!-- Badge -->
  <rect x="104" y="172" width="48" height="20" rx="10" fill="#CF4500"/>
  <text x="128" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF">SOC</text>
  <!-- Head -->
  <circle cx="128" cy="108" r="52" fill="#E8C9A0"/>
  <!-- Ear tufts (drooped) -->
  <path d="M86 74 L80 46 L102 68 Z" fill="#D4A574"/>
  <path d="M170 74 L176 46 L154 68 Z" fill="#D4A574"/>
  <!-- Face disc -->
  <ellipse cx="128" cy="108" rx="40" ry="34" fill="#F5E6D0"/>
  <!-- Eyes (worried, squinted) -->
  <ellipse cx="108" cy="104" rx="14" ry="10" fill="#FFF"/>
  <ellipse cx="148" cy="104" rx="14" ry="10" fill="#FFF"/>
  <circle cx="106" cy="104" r="5" fill="#141413"/>
  <circle cx="146" cy="104" r="5" fill="#141413"/>
  <circle cx="108" cy="102" r="2" fill="#FFF"/>
  <circle cx="148" cy="102" r="2" fill="#FFF"/>
  <!-- Brow furrow -->
  <path d="M94 92 L104 96" stroke="#D4A574" stroke-width="2" stroke-linecap="round"/>
  <path d="M162 92 L152 96" stroke="#D4A574" stroke-width="2" stroke-linecap="round"/>
  <!-- Beak -->
  <path d="M122 116 L128 124 L134 116 Z" fill="#F59E0B"/>
  <!-- Frown -->
  <path d="M120 128 Q128 124 136 128" stroke="#D4A574" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="108" cy="236" rx="14" ry="5" fill="#F59E0B"/>
  <ellipse cx="148" cy="236" rx="14" ry="5" fill="#F59E0B"/>
</svg>
