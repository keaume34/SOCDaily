<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Body / hoodie -->
  <ellipse cx="128" cy="170" rx="72" ry="60" fill="#4B5563"/>
  <!-- Hoodie front zip line -->
  <line x1="128" y1="130" x2="128" y2="230" stroke="#374151" stroke-width="2"/>
  <!-- SOC badge -->
  <rect x="100" y="155" width="56" height="24" rx="6" fill="#1D4ED8"/>
  <text x="128" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SOC</text>
  <!-- Head (round owl) -->
  <circle cx="128" cy="100" r="56" fill="#D4A574"/>
  <!-- Ear tufts -->
  <path d="M80 60 L72 30 L95 55 Z" fill="#C4956A"/>
  <path d="M176 60 L184 30 L161 55 Z" fill="#C4956A"/>
  <!-- Inner ear tufts -->
  <path d="M82 58 L77 38 L93 55 Z" fill="#E8C9A0"/>
  <path d="M174 58 L179 38 L163 55 Z" fill="#E8C9A0"/>
  <!-- Face disc (lighter area around eyes) -->
  <ellipse cx="128" cy="98" rx="44" ry="38" fill="#E8D5B8"/>
  <!-- Left eye white -->
  <circle cx="106" cy="94" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/>
  <!-- Right eye white -->
  <circle cx="150" cy="94" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/>
  <!-- Left pupil -->
  <circle cx="108" cy="93" r="9" fill="#1F2937"/>
  <circle cx="111" cy="90" r="3" fill="#FFFFFF"/>
  <!-- Right pupil -->
  <circle cx="152" cy="93" r="9" fill="#1F2937"/>
  <circle cx="155" cy="90" r="3" fill="#FFFFFF"/>
  <!-- Glasses bridge -->
  <path d="M124 94 Q128 90 132 94" stroke="#1F2937" stroke-width="2.5" fill="none"/>
  <!-- Glasses arms -->
  <path d="M88 92 L72 86" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M168 92 L184 86" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Beak -->
  <path d="M122 108 L128 118 L134 108 Z" fill="#F59E0B"/>
  <!-- Small smile -->
  <path d="M118 120 Q128 126 138 120" stroke="#92400E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Hoodie hood outline behind head -->
  <path d="M72 105 Q70 70 85 50" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M184 105 Q186 70 171 50" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="105" cy="228" rx="16" ry="6" fill="#F59E0B"/>
  <ellipse cx="151" cy="228" rx="16" ry="6" fill="#F59E0B"/>
</svg>
