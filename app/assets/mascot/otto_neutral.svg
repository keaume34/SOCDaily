  <rect x="104" y="172" width="48" height="20" rx="10" fill="#CF4500"/>
  <text x="128" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF">SOC</text>
  <!-- Head -->
  <circle cx="128" cy="108" r="52" fill="#E8C9A0"/>
  <!-- Ear tufts -->
  <path d="M84 72 L76 40 L100 66 Z" fill="#D4A574"/>
  <path d="M172 72 L180 40 L156 66 Z" fill="#D4A574"/>
