<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Sleeping Otto — closed eyes, peaceful -->
  <!-- Body -->
  <ellipse cx="128" cy="186" rx="64" ry="52" fill="#3B3B3A"/>
  <!-- Badge -->
  <rect x="104" y="172" width="48" height="20" rx="10" fill="#CF4500"/>
  <text x="128" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF">SOC</text>
  <!-- Head -->
  <circle cx="128" cy="108" r="52" fill="#E8C9A0"/>
  <!-- Ear tufts -->
  <path d="M84 72 L76 40 L100 66 Z" fill="#D4A574"/>
  <path d="M172 72 L180 40 L156 66 Z" fill="#D4A574"/>
  <!-- Night cap -->
  <path d="M84 82 Q80 40 128 30 Q160 26 186 56 L190 62" fill="#3860BE" opacity="0.85"/>
  <circle cx="190" cy="58" r="6" fill="#FFF"/>
  <!-- Face disc -->
  <ellipse cx="128" cy="108" rx="40" ry="34" fill="#F5E6D0"/>
  <!-- Closed eyes -->
  <path d="M96 104 Q108 96 120 104" stroke="#141413" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M136 104 Q148 96 160 104" stroke="#141413" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="96" cy="114" rx="7" ry="4" fill="#F5A0A0" opacity="0.35"/>
  <ellipse cx="160" cy="114" rx="7" ry="4" fill="#F5A0A0" opacity="0.35"/>
  <!-- Beak -->
  <path d="M122 116 L128 124 L134 116 Z" fill="#F59E0B"/>
  <!-- Peaceful smile -->
  <path d="M122 126 Q128 130 134 126" stroke="#D4A574" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Zzz -->
  <text x="174" y="52" font-family="sans-serif" font-size="16" font-weight="700" fill="#3860BE" opacity="0.7">Z</text>
  <text x="186" y="40" font-family="sans-serif" font-size="12" font-weight="700" fill="#3860BE" opacity="0.5">z</text>
  <text x="194" y="32" font-family="sans-serif" font-size="8" font-weight="700" fill="#3860BE" opacity="0.3">z</text>
  <!-- Feet -->
  <ellipse cx="108" cy="236" rx="14" ry="5" fill="#F59E0B"/>
  <ellipse cx="148" cy="236" rx="14" ry="5" fill="#F59E0B"/>
</svg>
