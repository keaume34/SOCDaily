<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Body / hoodie -->
  <ellipse cx="128" cy="170" rx="72" ry="60" fill="#4B5563"/>
  <!-- Hoodie front zip line -->
  <line x1="128" y1="130" x2="128" y2="230" stroke="#374151" stroke-width="2"/>
  <!-- SOC badge -->
  <rect x="100" y="155" width="56" height="24" rx="6" fill="#1D4ED8"/>
  <text x="128" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SOC</text>
  <!-- Head (round owl) -->
  <circle cx="128" cy="100" r="56" fill="#D4A574"/>
  <!-- Sleeping cap -->
  <path d="M82 75 Q78 30 128 20 Q160 16 190 50 L195 55" fill="#6366F1" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="195" cy="52" r="8" fill="#FFFFFF"/>
  <!-- Cap stripe -->
  <path d="M90 65 Q105 40 140 30" stroke="#818CF8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Face disc -->
  <ellipse cx="128" cy="98" rx="44" ry="38" fill="#E8D5B8"/>
  <!-- Closed left eye (sleeping — arc) -->
  <path d="M92 94 Q106 86 120 94" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Closed right eye -->
  <path d="M136 94 Q150 86 164 94" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Eyelash lines -->
  <path d="M94 92 L92 88" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M118 92 L120 88" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M138 92 L136 88" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M162 92 L164 88" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Glasses bridge (on closed eyes) -->
  <path d="M120 92 Q128 88 136 92" stroke="#1F2937" stroke-width="2.5" fill="none"/>
  <!-- Glasses arms -->
  <path d="M92 90 L76 84" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M164 90 L180 84" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Beak -->
  <path d="M122 108 L128 116 L134 108 Z" fill="#F59E0B"/>
  <!-- Peaceful sleeping mouth -->
  <path d="M122 118 Q128 122 134 118" stroke="#92400E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Zzz -->
  <text x="174" y="48" font-family="sans-serif" font-size="18" font-weight="700" fill="#6366F1" opacity="0.9">Z</text>
  <text x="188" y="34" font-family="sans-serif" font-size="14" font-weight="700" fill="#818CF8" opacity="0.7">z</text>
  <text x="198" y="24" font-family="sans-serif" font-size="10" font-weight="700" fill="#A5B4FC" opacity="0.5">z</text>
  <!-- Blush cheeks -->
  <ellipse cx="96" cy="106" rx="8" ry="5" fill="#FECACA" opacity="0.5"/>
  <ellipse cx="160" cy="106" rx="8" ry="5" fill="#FECACA" opacity="0.5"/>
  <!-- Hoodie hood outline -->
  <path d="M72 105 Q70 70 82 55" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M184 105 Q186 70 174 55" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="105" cy="228" rx="16" ry="6" fill="#F59E0B"/>
  <ellipse cx="151" cy="228" rx="16" ry="6" fill="#F59E0B"/>
</svg>
